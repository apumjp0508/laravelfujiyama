version: '3.8'

services:
  app:
    build:
      context: ../../            # ← リポジトリ直下（Dockerfileが直下にある想定）
      dockerfile: Dockerfile
    container_name: laravel_app_staging
    working_dir: /var/www/html
    volumes:
      - ../../:/var/www/html     # ← プロジェクトルートをコンテナへ
    depends_on:
      - db                       # ← appはdbに依存
    env_file:
      - ./.env.staging           # ← 同ディレクトリの.env.stagingを読む
    networks:
      - laravel_staging_network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx_staging
    ports:
      - "8080:80"                # http://localhost:8080
    volumes:
      - type: bind
        source: ../../           # プロジェクトルート（コード一式）
        target: /var/www/html
      - type: bind
        source: ./nginx/staging.conf   # ← compose から見て同階層の nginx/staging.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - app                      # ← nginxはappに依存
    networks:
      - laravel_staging_network

  db:
    image: mysql:8.0
    container_name: laravel_mysql_staging
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: staging_password
      MYSQL_DATABASE: coolmart_stg        # ← .env側と一致させる
      MYSQL_USER: staging_user
      MYSQL_PASSWORD: staging_password
    ports:
      - "3307:3306"
    volumes:
      - staging_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - laravel_staging_network

networks:
  laravel_staging_network:
    driver: bridge

volumes:
  staging_dbdata:

